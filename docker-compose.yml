# FraudMesh — hackathon prototype. SIMULATED DATA — NO REAL BANK INCIDENT.
#   docker compose up --build
#   dashboard: http://localhost:3000   API docs: http://localhost:8000/docs
services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      FRAUDMESH_DATA_DIR: /data
      FRAUDMESH_MODELS_DIR: /models
      FRAUDMESH_CORS_ORIGINS: ${FRAUDMESH_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - fraudmesh-data:/data
      - fraudmesh-models:/models
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  fraudmesh-data:
  fraudmesh-models:
